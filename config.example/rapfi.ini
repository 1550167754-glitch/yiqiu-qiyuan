; ============================================================
; 弈趣棋苑 —— 五子棋困难档强引擎（Rapfi）配置（示例 / 占位模板）
;
; 复制本文件为 config/rapfi.ini 后按需修改。
; 不创建本文件时使用默认值：启用 + 自动探测 + 每步 3000ms。
;
; ⚠ 保存编码必须是「UTF-8 无 BOM」。
; ============================================================

[rapfi]
; 总开关：false = 完全禁用 Rapfi，五子棋困难档回退内置 AlphaBeta+VCF/VCT
enabled = true

; 每步思考毫秒数。Rapfi 在 3s/步的棋力已远超内置引擎（GomoCup 2024 冠军，
; αβ+NNUE，arXiv:2503.13178）；想更快可设 1500~2000，想更强可设 5000~8000。
time_ms = 3000

; 引擎 exe 路径。留空 = 自动探测（engine/rapfi/ 下按 CPU 指令集能力
; 从 avx512vnni 到 sse 逐个功能性验证，首个可用者胜出）。
; 手动指定示例（Windows）：
; exe = D:\path\to\pbrain-rapfi-windows-avx2.exe
exe =
