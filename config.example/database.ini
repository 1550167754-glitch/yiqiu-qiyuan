; ============================================================
; 弈趣棋苑 —— PostgreSQL 数据库连接配置（示例 / 占位模板）
;
; 复制本文件为 config/database.ini 后按本机实际情况修改。
;
; ⚠ 保存编码必须是「UTF-8 无 BOM」：
;   记事本另存为请选「UTF-8」而不是「带 BOM 的 UTF-8」；
;   PowerShell 请用 -Encoding utf8NoBOM。
;   （BOM 会让 Python 的 configparser 报 "File contains no section
;     headers" 并让数据库功能静默失效——本项目踩过这个坑）
;
; 段名：[postgres]（[postgresql] / [pgsql] 也兼容）
;
; 步骤：
;   1. 创建数据库：CREATE DATABASE connect6;
;   2. 把 user / password 改为你的 PostgreSQL 账号密码
;   3. 程序首次连接时自动建表（players / games / moves）
; ============================================================
[postgres]
host = localhost
port = 5432
dbname = connect6
user = postgres
password = YOUR_PASSWORD_HERE
connect_timeout = 5
