; ============================================================
; 六子棋程序 —— PostgreSQL 数据库连接配置（示例，占位）
; 复制本文件为 config/database.ini 并按本机实际修改：
;   1. 在 PostgreSQL 中创建数据库：CREATE DATABASE connect6;
;   2. 将 user / password 改为你的 PostgreSQL 账号密码
;   3. 程序首次启动时会自动创建数据表（players / games / moves）
; ============================================================
[postgresql]
host = localhost
port = 5432
dbname = connect6
user = postgres
password = YOUR_PASSWORD_HERE
