; ============================================================
; 六子棋程序 —— 大模型（LLM）对战引擎配置（示例，占位）
; 支持 OpenAI 兼容接口的服务（DeepSeek / 阿里云百炼-千问 等）
; 复制本文件为 config/llm.ini 并填入你自己的 API Key。
; ⚠️ 真实 llm.ini 含密钥，已通过 .gitignore 排除，勿提交！
; ============================================================
[deepseek]
base_url = https://api.deepseek.com/v1
model = deepseek-chat
api_key = YOUR_DEEPSEEK_API_KEY
timeout = 40

[qwen]
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
model = qwen-plus
api_key = YOUR_DASHSCOPE_API_KEY
timeout = 40
